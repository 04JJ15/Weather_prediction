# config/targets.yaml

humidity:
  # target_col: 예측-관측 오차(잔차)를 학습 대상으로 삼는 MOS식 프레이밍.
  # obs_col: 원본 관측값(리포팅/가중치 조회용). forecast_col: 절대값 복원(pred_abs = pred + forecast_col)용.
  target_col: "습도(%)_오차"
  obs_col:    "습도(%)_관측"
  forecast_col: "습도(%)_예측"
  lag_col:    "습도(%)_예측"
  features:
    - 일사량(w/m^2)_예측
    - 습도(%)_예측
    - 절대습도_예측
    - 기온(degC)_예측
    - 대기압(mmHg)_예측
    - 이슬점_예측
    - VPD_예측
    - 일사량log_예측
    - hour
    - month
    - weekday
    - 일사량x기온
    - 습도x기온
    - 일사량x절대습도
    - 습도(%)_예측_lag_1h
    - 습도(%)_예측_lag_3h
    - 습도(%)_예측_lag_6h
    - 습도(%)_예측_lag_12h
    - 습도(%)_예측_lag_24h
    # 과거 오차(바이어스) lag: 자기상관성이 큰 편향을 반영하는 MOS식 피처
    - 습도(%)_오차_lag_1h
    - 습도(%)_오차_lag_3h
    - 습도(%)_오차_lag_6h
    - 습도(%)_오차_lag_12h
    - 습도(%)_오차_lag_24h
  lag:      [1, 3, 6, 12, 24]
  rolling:  []        # 없음

  models:
    lgbm:
      optuna_space:
        num_leaves: [16, 256]
        learning_rate: [1.0e-3, 1.0e-1]
        n_estimators: [50,   500]
        max_depth:         [5,    30]
        min_child_samples: [5,    100]
        subsample:         [0.5,  1.0]
        colsample_bytree:  [0.5,  1.0]
        lambda_l1:         [1.0e-8, 10.0]
        lambda_l2:         [1.0e-8, 10.0]
        min_gain_to_split: [0.0,  1.0]

    cat:
      optuna_space:
        learning_rate: [1.0e-3, 1.0e-1]
        depth: [4, 12]
        l2_leaf_reg: [1.0e-3, 10.0]
        bagging_temperature: [0.0, 1.0]
        border_count: [32, 255]
        iterations: [100, 1000]

    rf:
      optuna_space:
        n_estimators:      [100,  1000]
        max_depth:         [5,    30]
        min_samples_split: [2,    20]
        min_samples_leaf:  [1,    10]
        max_features:      ['sqrt', 'log2']

temperature:
  target_col: "기온(degC)_오차"
  obs_col:    "기온(degC)_관측"
  forecast_col: "기온(degC)_예측"
  lag_col:    "기온(degC)_예측"
  features:
    - 일사량(w/m^2)_예측
    - 기온(degC)_예측
    - hour
    - month
    - weekday
    - 기온(degC)_예측_lag_1h
    - 기온(degC)_예측_lag_3h
    - 기온(degC)_예측_lag_6h
    - 기온(degC)_예측_lag_12h
    - 기온(degC)_예측_lag_24h
    - 기온(degC)_예측_roll_3h
    - 기온(degC)_예측_roll_6h
    - 기온(degC)_오차_lag_1h
    - 기온(degC)_오차_lag_3h
    - 기온(degC)_오차_lag_6h
    - 기온(degC)_오차_lag_12h
    - 기온(degC)_오차_lag_24h
  lag:      [1, 3, 6, 12, 24]
  rolling:  [3, 6]

  models:
    lgbm:
      optuna_space:
        num_leaves:        [16, 128]
        learning_rate:     [1.0e-3, 1.0e-1]
        n_estimators:      [50, 500]
        max_depth:         [3, 15]
        min_child_samples: [5, 50]
        subsample:         [0.6, 1.0]
        colsample_bytree:  [0.6, 1.0]
        lambda_l1:         [1.0e-8, 10.0]
        lambda_l2:         [1.0e-8, 10.0]
        min_gain_to_split: [0.0,  1.0]
    
    cat:
      optuna_space:
        learning_rate:      [1.0e-3, 1.0e-1]
        depth:              [4, 12]
        l2_leaf_reg:        [1.0e-3, 10.0]
        bagging_temperature: [0.0, 1.0]
        border_count:       [32, 255]
        iterations:         [100, 1000]
    
    rf:
      optuna_space:
        n_estimators:      [100, 1000]
        max_depth:         [5, 30]
        min_samples_split: [2, 20]
        min_samples_leaf:  [1, 10]
        max_features:      ['sqrt','log2']

